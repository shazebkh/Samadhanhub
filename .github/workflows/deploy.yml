name: Deploy SamadhanHub to Render

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# No Pages permissions needed anymore — deploying to Render instead
permissions:
  contents: read

concurrency:
  group: "render-deploy"
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Verify the Node.js app builds and all routes start cleanly
  # ─────────────────────────────────────────────────────────────────────────
  build-check:
    name: Node.js Build & Route Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: SIH/package-lock.json

      - name: Install dependencies
        working-directory: SIH
        run: npm install

      - name: Check syntax — server.js & admin-routes.js
        working-directory: SIH
        run: |
          node --check server.js
          node --check admin-routes.js
          echo "✅ Syntax OK"

      - name: Smoke-test all routes
        working-directory: SIH
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3

          # Root → unified login/role-selection page
          curl -sf http://localhost:3000/ | grep -q "SamadhanHub" \
            && echo "✅ GET /  (login page) OK" \
            || (echo "❌ GET / FAILED" && kill $SERVER_PID && exit 1)

          # /app → main SamadhanHub community app
          curl -sf http://localhost:3000/app | grep -q "SamadhanHub" \
            && echo "✅ GET /app (main app) OK" \
            || (echo "❌ GET /app FAILED" && kill $SERVER_PID && exit 1)

          # /admin → admin dashboard (redirects to / without token — check HTML is served)
          curl -sf http://localhost:3000/admin | grep -q "Admin" \
            && echo "✅ GET /admin (dashboard) OK" \
            || (echo "❌ GET /admin FAILED" && kill $SERVER_PID && exit 1)

          # Admin API: unauthenticated → must return 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/admin/problems)
          [ "$STATUS" = "401" ] \
            && echo "✅ GET /api/admin/problems → 401 (auth guard OK)" \
            || (echo "❌ Auth guard FAILED (got $STATUS, expected 401)" && kill $SERVER_PID && exit 1)

          # Admin login with correct credentials → must return token
          LOGIN=$(curl -sf -X POST http://localhost:3000/api/admin/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin.samadhan","password":"1234"}')
          echo "$LOGIN" | grep -q "token" \
            && echo "✅ POST /api/admin/login → token issued OK" \
            || (echo "❌ Admin login FAILED" && kill $SERVER_PID && exit 1)

          kill $SERVER_PID
          echo ""
          echo "🎉 All route checks passed!"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Trigger Render deploy via Deploy Hook
  #
  # SETUP REQUIRED (one-time):
  #   1. Go to https://dashboard.render.com → your SamadhanHub service
  #   2. Settings → Deploy Hook → copy the URL
  #   3. GitHub repo → Settings → Secrets → Actions → New secret:
  #      Name:  RENDER_DEPLOY_HOOK
  #      Value: the URL you copied
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK secret not set."
            echo "   Follow the setup steps in this file to connect Render."
            echo "   Skipping deploy trigger."
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
              echo "✅ Render deploy triggered successfully! (HTTP $HTTP_STATUS)"
              echo "   Monitor progress at: https://dashboard.render.com"
            else
              echo "❌ Render deploy hook returned HTTP $HTTP_STATUS"
              exit 1
            fi
          fi
